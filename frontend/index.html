<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskHub</title>
    <!-- Applica il tema (classe "dark" + theme-color sopra) prima del primo
         paint di React: se aspettasse l'effect di useTheme() ci sarebbe un
         lampo del tema sbagliato ad ogni caricamento (schermo chiaro che poi
         scatta scuro, o viceversa, e/o colore della scheda del browser
         sbagliato). Senza una scelta esplicita salvata (mai toccato lo
         switch), si eredita il tema del sistema operativo/browser invece di
         forzare sempre scuro. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("deskhub-theme");
        } catch (e) {
          // storage non disponibile (privato/bloccato): si ricade sul sistema
        }
        var dark =
          stored === "light"
            ? false
            : stored === "dark"
            ? true
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#020617" : "#f8fafc");
      })();
    </script>
    <!-- Stessa icona (byte per byte) usata dentro i container desktop, vedi
         webtop-image/deskhub-icon.png: le due copie vanno tenute allineate
         a mano perche' i due Dockerfile hanno contesti di build separati. -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
